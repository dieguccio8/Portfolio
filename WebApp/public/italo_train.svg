<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="train-clip">
      <path d="M 0 130 L 1350 130 C 1450 130, 1500 150, 1540 210 C 1550 225, 1555 235, 1550 240 L 0 240 Z" />
    </clipPath>

    <pattern id="windows" x="0" y="162" width="60" height="26" patternUnits="userSpaceOnUse">
      <rect x="6" y="0" width="48" height="26" rx="4" fill="#050505" />
      <polygon points="6,0 26,0 16,26 6,26" fill="#1a1a1a" opacity="0.6" />
      <polygon points="36,0 46,0 36,26 26,26" fill="#1a1a1a" opacity="0.3" />
    </pattern>

    <pattern id="bellows" x="0" y="130" width="360" height="110" patternUnits="userSpaceOnUse">
      <rect x="345" y="0" width="15" height="110" fill="#111111" />
      <rect x="348" y="0" width="9" height="110" fill="#050505" />
      <rect x="351" y="0" width="3" height="110" fill="#1a1a1a" />
    </pattern>
    
    <pattern id="wheel-gaps" x="0" y="235" width="360" height="10" patternUnits="userSpaceOnUse">
      <rect x="40" y="0" width="70" height="10" fill="#050505" />
      <circle cx="60" cy="5" r="9" fill="#222" />
      <circle cx="90" cy="5" r="9" fill="#222" />
      <rect x="250" y="0" width="70" height="10" fill="#050505" />
      <circle cx="270" cy="5" r="9" fill="#222" />
      <circle cx="300" cy="5" r="9" fill="#222" />
    </pattern>
  </defs>

  <rect width="1600" height="300" fill="#0A0A0A" />
  
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.05">
    <line x1="100" y1="40" x2="350" y2="40" stroke-width="2" />
    <line x1="600" y1="70" x2="1200" y2="70" stroke-width="3" />
    <line x1="1300" y1="30" x2="1450" y2="30" stroke-width="1" />
    <line x1="50" y1="260" x2="400" y2="260" stroke-width="2" />
    <line x1="800" y1="280" x2="1350" y2="280" stroke-width="3" />
    <line x1="1450" y1="270" x2="1550" y2="270" stroke-width="1" />
  </g>

  <g stroke="#333333" stroke-width="2">
    <line x1="0" y1="50" x2="1600" y2="50" />
    <line x1="0" y1="65" x2="1600" y2="65" />
    <path d="M 200 10 L 200 130 M 700 10 L 700 130 M 1200 10 L 1200 130" stroke="#222" stroke-width="4" />
    <path d="M 180 50 L 220 50 M 180 65 L 220 65 M 680 50 L 720 50 M 680 65 L 720 65 M 1180 50 L 1220 50 M 1180 65 L 1220 65" stroke="#444" stroke-width="3" />
  </g>

  <g clip-path="url(#train-clip)">
    <rect x="0" y="100" width="1600" height="200" fill="#B50D3A" />
    
    <rect x="0" y="130" width="1600" height="16" fill="#5A051A" />
    
    <rect x="0" y="148" width="1600" height="4" fill="#E0E0E0" />
    
    <rect x="0" y="160" width="1600" height="30" fill="#141414" />
    
    <rect x="0" y="162" width="1330" height="26" fill="url(#windows)" />
    
    <rect x="0" y="215" width="1600" height="5" fill="#E0E0E0" />
    <rect x="0" y="223" width="1600" height="2" fill="#A0A0A0" />

    <rect x="0" y="130" width="1350" height="110" fill="url(#bellows)" opacity="0.9" />
    
    <rect x="0" y="130" width="1600" height="2" fill="#FFFFFF" opacity="0.15" />
    <rect x="0" y="190" width="1600" height="4" fill="#000000" opacity="0.15" />
  </g>

  <path d="M 1340 148 C 1400 148, 1450 165, 1490 195 L 1475 200 C 1440 175, 1395 160, 1340 160 Z" fill="#050505" />
  <path d="M 1350 151 C 1400 151, 1440 165, 1470 185 L 1460 190 C 1435 172, 1395 160, 1350 160 Z" fill="#FFFFFF" opacity="0.15" />
  
  <path d="M 1485 190 C 1500 205, 1515 220, 1530 235 L 1520 240 C 1500 220, 1475 200, 1450 190 Z" fill="#E0E0E0" opacity="0.8" />
  
  <path d="M 0 230 L 1480 230 C 1510 230, 1530 235, 1551 240 L 0 240 Z" fill="#111111" />
  <path d="M 0 230 L 1480 230" stroke="#FFFFFF" stroke-width="1" opacity="0.1" fill="none" />

  <rect x="0" y="235" width="1450" height="5" fill="url(#wheel-gaps)" />

  <rect x="0" y="240" width="1600" height="4" fill="#333333" />
  <rect x="0" y="244" width="1600" height="2" fill="#1a1a1a" />
  
  <rect x="0" y="246" width="1600" height="20" fill="#000000" opacity="0.5" />
  
  <g transform="translate(1100, 0)">
    <rect x="40" y="125" width="60" height="5" fill="#111" />
    <polygon points="50,125 60,115 80,115 90,125" fill="#333" />
    <path d="M 60 115 L 20 80 L 70 65 L 120 80 L 80 115" fill="none" stroke="#555" stroke-width="4" stroke-linejoin="round" />
    <path d="M 20 80 L 120 80" fill="none" stroke="#444" stroke-width="2" />
    <rect x="50" y="63" width="40" height="4" fill="#111" />
    <line x1="70" y1="63" x2="70" y2="50" stroke="#444" stroke-width="2" />
  </g>

  <circle cx="1535" cy="225" r="4" fill="#FFFFFF" filter="url(#glow)" />
  <path d="M 1535 225 L 1600 215 L 1600 235 Z" fill="#FFFFFF" opacity="0.15" />

  <path d="M 200 170 L 400 170 M 600 170 L 900 170 M 1000 170 L 1150 170" stroke="#FFFFFF" stroke-width="2" opacity="0.15" stroke-linecap="round" />
</svg>
